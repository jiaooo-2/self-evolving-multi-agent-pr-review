<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="494" viewBox="0 0 1080 494" role="img"><style>text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif} .muted{fill:#64748b}.label{font-size:16px;fill:#64748b}.title{font-size:26px;font-weight:700;fill:#142b3b}</style><rect width="1080" height="494" rx="24" fill="#f4f8fb"/><text x="36" y="42" font-size="14" fill="#087f8c" font-weight="700">EVOAGENT / PR → REVIEW → FEEDBACK</text><text x="36" y="86" font-size="30" fill="#142b3b" font-weight="700">把代码变更，变成有依据的审查结论。</text><rect x="36" y="116" width="318" height="266" rx="16" fill="#fff" stroke="#dde6ee"/><text x="58" y="150" font-size="16" fill="#087f8c" font-weight="700">01 / 提交 PR</text><text x="58" y="192" font-size="18" fill="#64748b" font-weight="400">payments.py</text><rect x="54" y="212" width="282" height="130" rx="16" fill="#102c3d" stroke="#dde6ee"/><text x="69" y="246" font-size="16" fill="#b6efda" font-weight="400">+ def refund(request):</text><text x="69" y="277" font-size="16" fill="#b6efda" font-weight="400">+   order = load(id)</text><text x="69" y="308" font-size="16" fill="#b6efda" font-weight="400">+   issue_refund(order)</text><path d="M360 248 L389 248" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M383 243 L389 248 L383 253" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="396" y="116" width="648" height="266" rx="16" fill="#fff" stroke="#dde6ee"/><text x="420" y="150" font-size="16" fill="#087f8c" font-weight="700">02 / 得到可行动的报告</text><rect x="420" y="169" width="84" height="31" rx="16" fill="#fff0ed" stroke="#dde6ee"/><text x="436" y="191" font-size="14" fill="#c34934" font-weight="700">HIGH</text><text x="520" y="191" font-size="20" fill="#142b3b" font-weight="700">示例：退款前缺少归属校验</text><text x="420" y="235" font-size="16" fill="#64748b" font-weight="400">定位</text><text x="525" y="235" font-size="17" fill="#142b3b" font-weight="400">payments.py · 新增代码行</text><text x="420" y="279" font-size="16" fill="#64748b" font-weight="400">依据</text><text x="525" y="279" font-size="17" fill="#142b3b" font-weight="400">请求用户 → 订单查询 → 退款调用</text><text x="420" y="323" font-size="16" fill="#64748b" font-weight="400">建议</text><text x="525" y="323" font-size="17" fill="#142b3b" font-weight="400">验证订单归属，并补充越权请求测试</text><text x="36" y="424" font-size="20" fill="#087f8c" font-weight="700">03 / 配置测试并验证补丁 → Draft PR → 人工审核</text><text x="36" y="464" font-size="14" fill="#64748b" font-weight="400">结果示意 · 非产品截图或实测案例。修复未配置测试时仅提供建议。</text></svg>
