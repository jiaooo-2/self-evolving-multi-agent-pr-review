<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="494" viewBox="0 0 1080 494" role="img"><style>text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif} .muted{fill:#64748b}.label{font-size:16px;fill:#64748b}.title{font-size:26px;font-weight:700;fill:#142b3b}</style><rect width="1080" height="494" rx="24" fill="#f4f8fb"/><text x="36" y="42" font-size="14" fill="#087f8c" font-weight="700">EVOAGENT / PR → REVIEW → FEEDBACK</text><text x="36" y="86" font-size="30" fill="#142b3b" font-weight="700">Turn code changes into evidence-backed reviews.</text><rect x="36" y="116" width="318" height="266" rx="16" fill="#fff" stroke="#dde6ee"/><text x="58" y="150" font-size="16" fill="#087f8c" font-weight="700">01 / OPEN A PR</text><text x="58" y="192" font-size="18" fill="#64748b" font-weight="400">payments.py</text><rect x="54" y="212" width="282" height="130" rx="16" fill="#102c3d" stroke="#dde6ee"/><text x="69" y="246" font-size="16" fill="#b6efda" font-weight="400">+ def refund(request):</text><text x="69" y="277" font-size="16" fill="#b6efda" font-weight="400">+   order = load(id)</text><text x="69" y="308" font-size="16" fill="#b6efda" font-weight="400">+   issue_refund(order)</text><path d="M360 248 L389 248" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M383 243 L389 248 L383 253" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="396" y="116" width="648" height="266" rx="16" fill="#fff" stroke="#dde6ee"/><text x="420" y="150" font-size="16" fill="#087f8c" font-weight="700">02 / GET AN ACTIONABLE REPORT</text><rect x="420" y="169" width="84" height="31" rx="16" fill="#fff0ed" stroke="#dde6ee"/><text x="436" y="191" font-size="14" fill="#c34934" font-weight="700">HIGH</text><text x="520" y="191" font-size="20" fill="#142b3b" font-weight="700">Example: missing ownership check</text><text x="420" y="235" font-size="16" fill="#64748b" font-weight="400">Location</text><text x="525" y="235" font-size="17" fill="#142b3b" font-weight="400">payments.py · added lines</text><text x="420" y="279" font-size="16" fill="#64748b" font-weight="400">Evidence</text><text x="525" y="279" font-size="17" fill="#142b3b" font-weight="400">request user → order lookup → refund</text><text x="420" y="323" font-size="16" fill="#64748b" font-weight="400">Next step</text><text x="525" y="323" font-size="17" fill="#142b3b" font-weight="400">Check ownership; add an unauthorized-request test</text><text x="36" y="424" font-size="20" fill="#087f8c" font-weight="700">03 / Configure tests → verify patch → Draft PR → human review</text><text x="36" y="464" font-size="14" fill="#64748b" font-weight="400">Illustrative example, not a product screenshot. Without repair tests, fixes remain suggestions.</text></svg>
