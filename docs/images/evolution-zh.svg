<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="442" viewBox="0 0 1080 442" role="img"><style>text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif} .muted{fill:#64748b}.label{font-size:16px;fill:#64748b}.title{font-size:26px;font-weight:700;fill:#142b3b}</style><rect width="1080" height="442" rx="24" fill="#f4f8fb"/><text x="36" y="44" font-size="14" fill="#087f8c" font-weight="700">02 / FEEDBACK-DRIVEN EVOLUTION</text><text x="36" y="87" font-size="30" fill="#142b3b" font-weight="700">每次改进，都要经过评测。</text><rect x="36" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="54" y="166" font-size="23" fill="#142b3b" font-weight="700">确认反馈</text><text x="54" y="205" font-size="15" fill="#142b3b" font-weight="400">误报 · 漏报 · 坏修复</text><path d="M278 180 L293 180" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M287 175 L293 180 L287 185" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="299" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="317" y="166" font-size="23" fill="#142b3b" font-weight="700">生成候选</text><text x="317" y="205" font-size="15" fill="#142b3b" font-weight="400">审查策略 / Skill</text><path d="M541 180 L556 180" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M550 175 L556 180 L550 185" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="562" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="580" y="166" font-size="23" fill="#142b3b" font-weight="700">验证集回放</text><text x="580" y="205" font-size="15" fill="#142b3b" font-weight="400">提升 + 非退化</text><path d="M804 180 L819 180" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M813 175 L819 180 L813 185" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="825" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="843" y="166" font-size="23" fill="#142b3b" font-weight="700">隐藏集门禁</text><text x="843" y="205" font-size="15" fill="#142b3b" font-weight="400">受保护指标不退化</text><rect x="36" y="270" width="322" height="95" rx="16" fill="#e7f4ef" stroke="#dde6ee"/><text x="54" y="308" font-size="18" fill="#142b3b" font-weight="700">PASS / 通过</text><text x="54" y="340" font-size="16" fill="#142b3b" font-weight="400">激活，或等待影子验证</text><rect x="379" y="270" width="322" height="95" rx="16" fill="#fff0ed" stroke="#dde6ee"/><text x="397" y="308" font-size="18" fill="#142b3b" font-weight="700">REJECTED / 未通过</text><text x="397" y="340" font-size="16" fill="#142b3b" font-weight="400">门禁失败，拒绝候选</text><rect x="722" y="270" width="322" height="95" rx="16" fill="#fff7df" stroke="#dde6ee"/><text x="740" y="308" font-size="18" fill="#142b3b" font-weight="700">DEFERRED / 暂缓</text><text x="740" y="340" font-size="16" fill="#142b3b" font-weight="400">模型或样本等条件不足</text><text x="36" y="410" font-size="15" fill="#64748b" font-weight="400">保留版本、评测记录与回滚入口。流程可评测，不代表准确率必然提升。</text></svg>
