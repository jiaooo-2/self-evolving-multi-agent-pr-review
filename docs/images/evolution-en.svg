<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="442" viewBox="0 0 1080 442" role="img"><style>text{font-family:Segoe UI,Microsoft YaHei,Arial,sans-serif} .muted{fill:#64748b}.label{font-size:16px;fill:#64748b}.title{font-size:26px;font-weight:700;fill:#142b3b}</style><rect width="1080" height="442" rx="24" fill="#f4f8fb"/><text x="36" y="44" font-size="14" fill="#087f8c" font-weight="700">02 / FEEDBACK-DRIVEN EVOLUTION</text><text x="36" y="87" font-size="30" fill="#142b3b" font-weight="700">Every candidate must earn its activation.</text><rect x="36" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="54" y="166" font-size="23" fill="#142b3b" font-weight="700">Feedback</text><text x="54" y="205" font-size="15" fill="#142b3b" font-weight="400">FPs · misses · bad fixes</text><path d="M278 180 L293 180" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M287 175 L293 180 L287 185" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="299" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="317" y="166" font-size="23" fill="#142b3b" font-weight="700">Candidate</text><text x="317" y="205" font-size="15" fill="#142b3b" font-weight="400">Review policy / Skill</text><path d="M541 180 L556 180" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M550 175 L556 180 L550 185" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="562" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="580" y="166" font-size="23" fill="#142b3b" font-weight="700">Validation</text><text x="580" y="205" font-size="15" fill="#142b3b" font-weight="400">Improvement + no regression</text><path d="M804 180 L819 180" stroke="#93aabd" stroke-width="2" fill="none"/><path d="M813 175 L819 180 L813 185" stroke="#93aabd" stroke-width="2" fill="none"/><rect x="825" y="127" width="239" height="110" rx="16" fill="#fff" stroke="#dde6ee"/><text x="843" y="166" font-size="23" fill="#142b3b" font-weight="700">Holdout</text><text x="843" y="205" font-size="15" fill="#142b3b" font-weight="400">Protected metrics pass</text><rect x="36" y="270" width="322" height="95" rx="16" fill="#e7f4ef" stroke="#dde6ee"/><text x="54" y="308" font-size="18" fill="#142b3b" font-weight="700">PASS</text><text x="54" y="340" font-size="16" fill="#142b3b" font-weight="400">Activate or await shadow review</text><rect x="379" y="270" width="322" height="95" rx="16" fill="#fff0ed" stroke="#dde6ee"/><text x="397" y="308" font-size="18" fill="#142b3b" font-weight="700">REJECTED</text><text x="397" y="340" font-size="16" fill="#142b3b" font-weight="400">Candidate fails the gates</text><rect x="722" y="270" width="322" height="95" rx="16" fill="#fff7df" stroke="#dde6ee"/><text x="740" y="308" font-size="18" fill="#142b3b" font-weight="700">DEFERRED</text><text x="740" y="340" font-size="16" fill="#142b3b" font-weight="400">Prerequisites are missing</text><text x="36" y="410" font-size="15" fill="#64748b" font-weight="400">Version history, evaluation records and rollback. This workflow does not guarantee accuracy gains.</text></svg>
